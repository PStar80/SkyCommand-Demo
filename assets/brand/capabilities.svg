8" class="spark"/><path d="M21 349H9V361" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M451 349H463V361" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M21 485H9V473" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M451 485H463V473" fill="none" stroke="#A9C9DD" opacity=".65"/><g transform="translate(24 363)" fill="none" stroke="#25D6FF" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="1" width="16" height="22"/><path d="M8 7h8M8 12h8M8 17h5"/></g><text x="62" y="383" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start" >Structured Results</text><path d="M24 402H448" stroke="#22485C"/><text x="26" y="434" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >Inspect workflow and node outcomes</text><text x="26" y="462" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >through structured outputs.</text></g><g id="feature-visibility"><rect x="490" y="342" width="468" height="150" fill="url(#surface)" stroke="url(#metal)" stroke-width="2"/><rect x="495" y="347" width="458" height="140" fill="url(#grid)" stroke="#163349" /><path d="M490 342H958V492H490Z" fill="none" stroke="#25D6FF" stroke-width="1.5" opacity=".5" pathLength="100" stroke-dasharray="6 94" class="sweep"/><path d="M490 342H958V492H490Z" fill="none" stroke="#E6FAFF" stroke-width="1.5" opacity=".65" pathLength="100" stroke-dasharray="1.2 98.8" class="spark"/><path d="M509 349H497V361" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M939 349H951V361" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M509 485H497V473" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M939 485H951V473" fill="none" stroke="#A9C9DD" opacity=".65"/><g transform="translate(512 363)" fill="none" stroke="#25D6FF" stroke-width="1.6" stroke-linejoin="round"><path d="M1 12h5l3-9 5 18 3-9h6"/></g><text x="550" y="383" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start" >Operational Visibility</text><path d="M512 402H936" stroke="#22485C"/><text x="514" y="434" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >Follow run history and diagnostics</text><text x="514" y="462" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >from a shared operator interface.</text></g>
