name: Publish prepared SkyCommand showcase (one time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-showcase-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the verified documentation and branding package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, re, urllib.request, zlib
          from pathlib import PurePosixPath
          from xml.etree import ElementTree as ET

          REPO = "PStar80/SkyCommand-Demo"
          SOURCE = "https://raw.githubusercontent.com/PStar80/PStar80/fa445e05917540adf7672ed61306fa6531361f76/hero.svg"
          ART_HASH = "626c03f61f870820d6dbb5075afc4f96cf83d91c52a7137254bcd239b0b7568b"
          EXPECTED = {'MAINTAINING.md': 'f46f16112c4b520b474af7eea4770dc5ece558e543746b72f6a26de12b339288', 'README.md': '90f1060e6b90c826a6c0ec40bdd6375444a9cbd8b8c5412606a6ab802c40ff8f', 'assets/brand/hero-mobile-static.svg': 'd5cb755680e821400a71089a79bc48e6388020fad21fdb34ac7822df99149d68', 'assets/brand/hero-mobile.svg': '01c183f2123998c48f2a73cac1928ad89e39eacfadc3bf657d1d60e6f59cad06', 'assets/brand/hero-static.svg': '2ff8154ca0971caa412b2239c1c5b7ccdde9c7411960d4e3c5d598e7b9192a20', 'assets/brand/hero.svg': '3a669b8db2b62bd3a860c40c0fd1b099064dfef4f3fb9603c0914ab5eb9f1770', 'assets/screenshots/README.md': '2c849649fdf2c0d23969f5d39045b409bcc3e1a2088f0b6a3006f9fef1119b55', 'docs/architecture.md': '587a0cf077afdfa282053180163a8834bd15edd951fac64ca2dc61b4dc337e61', 'docs/features.md': '3972592c854908547d18b7bec27711b5687beeec3132b7aee68c0e0aa3c5a8b2', 'docs/gallery.md': '8ebf3bdff8f5c7cd2d59b0fe5924dc565995b4366905931b767df2d507970567', 'docs/walkthrough.md': 'da19135e2cf441f02656efe61e16d294217fdebcc12b3ab09d811afb097f647e'}
          PAYLOAD = ""

          assert os.environ["GITHUB_REPOSITORY"] == REPO, "Unexpected repository"
          files = json.loads(zlib.decompress(base64.b64decode(PAYLOAD)))
          assert set(files) == set(EXPECTED), "Unexpected publication paths"
          with urllib.request.urlopen(SOURCE, timeout=30) as response:
              source_svg = response.read().decode("utf-8")
          artwork = [s for s in re.findall(r"data:image/png;base64,([A-Za-z0-9+/=]+)", source_svg)
                     if hashlib.sha256(s.encode()).hexdigest() == ART_HASH]
          assert len(artwork) == 1, "Approved artwork not found"
          for path, text in files.items():
              assert not PurePosixPath(path).is_absolute() and ".." not in PurePosixPath(path).parts
              text = text.replace("__SKYCOMMAND_APPROVED_ART_BASE64__", artwork[0])
              assert hashlib.sha256(text.encode("utf-8")).hexdigest() == EXPECTED[path], path
              if path.endswith(".svg"):
                  ET.fromstring(text)
              files[path] = text

          api_root = "https://api.github.com/repos/" + REPO
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "SkyCommand-showcase-publication",
                     "Content-Type": "application/json"}
          def api(path, method="GET", data=None):
              body = None if data is None else json.dumps(data).encode("utf-8")
              request = urllib.request.Request(api_root + path, data=body, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)

          head = api("/git/ref/heads/main")["object"]["sha"]
          assert head == os.environ["GITHUB_SHA"], "Branch advanced; not overwriting newer work"
          parent = api("/git/commits/" + head)
          entries = [{"path": path, "mode": "100644", "type": "blob", "content": text}
                     for path, text in sorted(files.items())]
          tree = api("/git/trees", "POST", {"base_tree": parent["tree"]["sha"], "tree": entries})
          commit = api("/git/commits", "POST", {
              "message": "Publish SkyCommand documentation showcase and blue metallic branding",
              "tree": tree["sha"], "parents": [head]})
          api("/git/refs/heads/main", "PATCH", {"sha": commit["sha"], "force": False})
          print("Published 11 verified showcase files in commit " + commit["sha"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Showcase published\n\nCommit: `" + commit["sha"] + "`\n\n")
              summary.write("All 11 files match the prepared package. Only documentation and branding assets were published.\n")
