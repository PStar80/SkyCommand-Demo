<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif" data-motion="static">
<title id="title">SkyCommand — Platform Architecture</title><desc id="desc">Operators and configured coding agents use shared UI/API services, including MCP access for coding agents. Registered Tools, AI Agents and Published Workflows form the execution layer. Automation can operate on File System, Database, Git Repositories and Web APIs within configured permissions. Conceptual diagram, not a deployment specification or live status. Static reduced-motion version.</desc>
<defs>
