<svg xmlns="http://www.w3.org/2000/svg" width="480" height="920" viewBox="0 0 480 920" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">SkyCommand — Key Capabilities</title><desc id="desc">Reusable Tools, Published Workflows, AI Agents, External MCP Access, Structured Results and Operational Visibility.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#06111C"/><stop offset=".55" stop-color="#07131F"/><stop offset="1" stop-color="#020A12"/></linearGradient>
<linearGradient id="metal" x2="1" y2="1"><stop stop-color="#D8E7EE"/><stop offset=".10" stop-color="#3C596D"/><stop offset=".26" stop-color="#9DB5C4"/><stop offset=".42" stop-color="#1F3547"/><stop offset=".57" stop-color="#6B96B1"/><stop offset=".72" stop-color="#E3F4FF"/><stop offset=".84" stop-color="#365569"/><stop offset="1" stop-color="#91ACBF"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#40BCFF" stroke-opacity=".055"/></pattern>
<linearGradient id="shade"><stop stop-color="#020B14" stop-opacity=".93"/><stop offset=".36" stop-color="#020B14" stop-opacity=".72"/><stop offset=".67" stop-color="#020B14" stop-opacity=".08"/><stop offset="1" stop-color="#020B14" stop-opacity=".02"/></linearGradient>
<linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#020B14" stop-opacity="0"/><stop offset=".6" stop-color="#020B14" stop-opacity=".05"/><stop offset="1" stop-color="#020B14" stop-opacity=".85"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#6BE8FF"/><stop offset="1" stop-color="#25D6FF" stop-opacity="0"/></radialGradient>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#25D6FF"/></marker>
</defs>
<style>
.sweep{animation:sweep 26s linear infinite}.spark{animation:sweep 26s linear infinite}
.stream{animation:data 6s linear infinite}.halo{opacity:.16;animation:breathe 7s ease-in-out infinite}
.ring{animation:data 18s linear infinite}.dust{animation:drift 11s ease-in-out infinite}
@keyframes sweep{to{stroke-dashoffset:-100}}@keyframes data{to{stroke-dashoffset:-100}}
@keyframes breathe{0%,100%{opacity:.10}50%{opacity:.26}}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.16}50%{transform:translateY(-5px);opacity:.5}}
@media(prefers-reduced-motion:reduce){.sweep,.spark,.stream,.halo,.ring,.dust{animation:none!important}}
</style>
<g id="feature-tools"><rect x="2" y="2" width="476" height="136" fill="url(#surface)" stroke="url(#metal)" stroke-width="2"/><rect x="7" y="7" width="466" height="126" fill="url(#grid)" stroke="#163349" /><path d="M2 2H478V138H2Z" fill="none" stroke="#25D6FF" stroke-width="1.5" opacity=".5" pathLength="100" stroke-dasharray="6 94" class="sweep"/><path d="M2 2H478V138H2Z" fill="none" stroke="#E6FAFF" stroke-width="1.5" opacity=".65" pathLength="100" stroke-dasharray="1.2 98.8" class="spark"/><path d="M21 9H9V21" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M459 9H471V21" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M21 131H9V119" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M459 131H471V119" fill="none" stroke="#A9C9DD" opacity=".65"/><g transform="translate(24 23)" fill="none" stroke="#25D6FF" stroke-width="1.6" stroke-linejoin="round"><path d="M7 4L1 12l6 8M17 4l6 8-6 8M14 2l-4 20"/></g><text x="62" y="43" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start" >Reusable Tools</text><path d="M24 62H456" stroke="#22485C"/><text x="26" y="94" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >Compose registered operations</text><text x="26" y="122" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >with explicit inputs and results.</text></g><g id="feature-flow"><rect x="2" y="158" width="476" height="136" fill="url(#surface)" stroke="url(#metal)" stroke-width="2"/><rect x="7" y="163" width="466" height="126" fill="url(#grid)" stroke="#163349" /><path d="M2 158H478V294H2Z" fill="none" stroke="#25D6FF" stroke-width="1.5" opacity=".5" pathLength="100" stroke-dasharray="6 94" class="sweep"/><path d="M2 158H478V294H2Z" fill="none" stroke="#E6FAFF" stroke-width="1.5" opacity=".65" pathLength="100" stroke-dasharray="1.2 98.8" class="spark"/><path d="M21 165H9V177" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M459 165H471V177" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M21 287H9V275" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M459 287H471V275" fill="none" stroke="#A9C9DD" opacity=".65"/><g transform="translate(24 179)" fill="none" stroke="#25D6FF" stroke-width="1.6" stroke-linejoin="round"><rect x="1" y="2" width="8" height="7"/><rect x="15" y="15" width="8" height="7"/><path d="M5 9v9h10"/></g><text x="62" y="199" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start" >Published Workflows</text><path d="M24 218H456" stroke="#22485C"/><text x="26" y="250" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >Temporal-backed execution with</text><text x="26" y="278" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >retries, scheduling and recovery.</text></g><g id="feature-agent"><rect x="2" y="314" width="476" height="136" fill="url(#surface)" stroke="url(#metal)" stroke-width="2"/><rect x="7" y="319" width="466" height="126" fill="url(#grid)" stroke="#163349" /><path d="M2 314H478V450H2Z" fill="none" stroke="#25D6FF" stroke-width="1.5" opacity=".5" pathLength="100" stroke-dasharray="6 94" class="sweep"/><path d="M2 314H478V450H2Z" fill="none" stroke="#E6FAFF" stroke-width="1.5" opacity=".65" pathLength="100" stroke-dasharray="1.2 98.8" class="spark"/><path d="M21 321H9V333" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M459 321H471V333" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M21 443H9V431" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M459 443H471V431" fill="none" stroke="#A9C9DD" opacity=".65"/><g transform="translate(24 335)" fill="none" stroke="#25D6FF" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="6" width="18" height="15"/><path d="M12 6V2M8 11v4m8-4v4M8 18h8M0 11h3m18 0h3"/></g><text x="62" y="355" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start" >AI Agents</text><path d="M24 374H456" stroke="#22485C"/><text x="26" y="406" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >Run embedded agents with</text><tex