name: Publish prepared SkyCommand branding (one time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-showcase-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconstruct and publish the four approved branding assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, re, urllib.request
          from xml.etree import ElementTree as ET

          REPO = 'PStar80/SkyCommand-Demo'
          SOURCE = 'https://raw.githubusercontent.com/PStar80/PStar80/07e1bc8ade1606ee91a39fb429fddc7545005e53/'
          EXPECTED = {
              'hero.svg': '3a669b8db2b62bd3a860c40c0fd1b099064dfef4f3fb9603c0914ab5eb9f1770',
              'hero-mobile.svg': '01c183f2123998c48f2a73cac1928ad89e39eacfadc3bf657d1d60e6f59cad06',
              'hero-static.svg': '2ff8154ca0971caa412b2239c1c5b7ccdde9c7411960d4e3c5d598e7b9192a20',
              'hero-mobile-static.svg': 'd5cb755680e821400a71089a79bc48e6388020fad21fdb34ac7822df99149d68',
          }
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          title = '<title id="title">SkyCommand — workflow automation and orchestration</title>'
          desc = '<desc id="desc">SkyCommand, an independent workflow automation and orchestration platform by Paul Sattaur. Deterministic workflows, optional AI agents, and observable execution. Decorative concept artwork, not an application screenshot.</desc>'
          files = {}
          for name in ('hero.svg', 'hero-mobile.svg'):
              with urllib.request.urlopen(SOURCE + name, timeout=30) as response:
                  svg = response.read().decode('utf-8')
              svg = re.sub(r'<title.*?</title>', title, svg)
              svg = re.sub(r'<desc.*?</desc>', desc, svg)
              svg = svg.replace('sweep 14s', 'sweep 22s').replace('SOFTWARE ENGINEERING', 'PRODUCT SHOWCASE')
              if name == 'hero.svg':
                  pattern = r'<text x="31" y="108"[^>]*>Paul </text><text x="158" y="108"[^>]*>Sattaur</text>'
                  heading = '<text x="31" y="108" fill="#F0F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="750">Sky<tspan fill="#25D6FF">Command</tspan></text>'
                  svg = re.sub(pattern, heading, svg)
                  for old, new in [('Workflow Automation', 'Workflow automation'), ('Agentic AI Orchestration', 'Deterministic by default.'), ('BACKEND SYSTEMS', 'REUSABLE TOOLS'), ('DATA ENGINEERING', 'OPTIONAL AI AGENTS'), ('AI-ASSISTED DELIVERY', 'OBSERVABLE EXECUTION')]:
                      svg = svg.replace(old, new)
              else:
                  svg = svg.replace('>Paul Sattaur</text>', '>SkyCommand</text>')
                  svg = svg.replace('font-size="17"', 'font-size="16"')
                  svg = svg.replace('Workflow Automation · Agentic AI', 'Workflow automation · Optional AI agents')
              files[name] = svg
              static = re.sub(r'<style>.*?</style>', '', svg, flags=re.S)
              static = re.sub(r' class="(?:sweep|spark|pulse|flow|rise)"', '', static)
              static = re.sub(r' style="animation-delay:[^"]*"', '', static)
              static = static.replace('<svg ', '<svg data-motion="static" ', 1)
              files[name.replace('.svg', '-static.svg')] = static
          assert set(files) == set(EXPECTED)
          for name, svg in files.items():
              assert hashlib.sha256(svg.encode('utf-8')).hexdigest() == EXPECTED[name], name
              ET.fromstring(svg)

          api_root = 'https://api.github.com/repos/' + REPO
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'SkyCommand-showcase-publication', 'Content-Type': 'application/json'}
          def api(path, method='GET', data=None):
              body = None if data is None else json.dumps(data).encode('utf-8')
              request = urllib.request.Request(api_root + path, data=body, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          head = api('/git/ref/heads/main')['object']['sha']
          assert head == os.environ['GITHUB_SHA'], 'Branch advanced; preserving newer work'
          parent = api('/git/commits/' + head)
          entries = [{'path': 'assets/brand/' + name, 'mode': '100644', 'type': 'blob', 'content': svg} for name, svg in sorted(files.items())]
          tree = api('/git/trees', 'POST', {'base_tree': parent['tree']['sha'], 'tree': entries})
          commit = api('/git/commits', 'POST', {'message': 'Publish approved SkyCommand animated and static branding assets', 'tree': tree['sha'], 'parents': [head]})
          api('/git/refs/heads/main', 'PATCH', {'sha': commit['sha'], 'force': False})
          print('Published four branding assets matching the approved package: ' + commit['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Four SVG files published; all SHA-256 hashes match the prepared package. Commit: ' + commit['sha'] + '\n')
