21 633H9V645" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M459 633H471V645" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M21 755H9V743" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M459 755H471V743" fill="none" stroke="#A9C9DD" opacity=".65"/><g transform="translate(24 647)" fill="none" stroke="#25D6FF" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="1" width="16" height="22"/><path d="M8 7h8M8 12h8M8 17h5"/></g><text x="62" y="667" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start" >Structured Results</text><path d="M24 686H456" stroke="#22485C"/><text x="26" y="718" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >Inspect workflow and node outcomes</text><text x="26" y="746" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >through structured outputs.</text></g><g id="feature-visibility"><rect x="2" y="782" width="476" height="136" fill="url(#surface)" stroke="url(#metal)" stroke-width="2"/><rect x="7" y="787" width="466" height="126" fill="url(#grid)" stroke="#163349" /><path d="M2 782H478V918H2Z" fill="none" stroke="#25D6FF" stroke-width="1.5" opacity=".5" pathLength="100" stroke-dasharray="6 94" class="sweep"/><path d="M2 782H478V918H2Z" fill="none" stroke="#E6FAFF" stroke-width="1.5" opacity=".65" pathLength="100" stroke-dasharray="1.2 98.8" class="spark"/><path d="M21 789H9V801" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M459 789H471V801" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M21 911H9V899" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M459 911H471V899" fill="none" stroke="#A9C9DD" opacity=".65"/><g transform="translate(24 803)" fill="none" stroke="#25D6FF" stroke-width="1.6" stroke-linejoin="round"><path d="M1 12h5l3-9 5 18 3-9h6"/></g><text x="62" y="823" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start" >Operational Visibility</text><path d="M24 842H456" stroke="#22485C"/><text x="26" y="874" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >Follow run history and diagnostics</text><text x="26" y="902" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start" >from a shared operator interface.</text></g>
